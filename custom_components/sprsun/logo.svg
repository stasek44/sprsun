<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#0066cc" opacity="0.1"/>
  
  <!-- Heat pump cycle arrows -->
  <path d="M 128 40 A 88 88 0 0 1 216 128" stroke="#ff6600" stroke-width="12" fill="none" stroke-linecap="round"/>
  <polygon points="220,128 208,118 208,138" fill="#ff6600"/>
  
  <path d="M 216 128 A 88 88 0 0 1 128 216" stroke="#0066cc" stroke-width="12" fill="none" stroke-linecap="round"/>
  <polygon points="128,220 118,208 138,208" fill="#0066cc"/>
  
  <path d="M 128 216 A 88 88 0 0 1 40 128" stroke="#ff6600" stroke-width="12" fill="none" stroke-linecap="round"/>
  <polygon points="36,128 48,118 48,138" fill="#ff6600"/>
  
  <path d="M 40 128 A 88 88 0 0 1 128 40" stroke="#0066cc" stroke-width="12" fill="none" stroke-linecap="round"/>
  <polygon points="128,36 118,48 138,48" fill="#0066cc"/>
  
  <!-- Center icon - heat/cool symbol -->
  <circle cx="128" cy="128" r="45" fill="white" stroke="#333" stroke-width="3"/>
  
  <!-- Hot side (top) -->
  <path d="M 128 95 L 128 85 M 120 88 L 120 78 M 136 88 L 136 78" stroke="#ff6600" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Cold side (bottom) -->
  <path d="M 128 161 L 128 171 M 118 163 L 118 169 M 138 163 L 138 169 M 123 166 L 123 168 M 133 166 L 133 168" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Horizontal divider -->
  <line x1="100" y1="128" x2="156" y2="128" stroke="#333" stroke-width="2"/>
  
  <!-- Text SPRSUN -->
  <text x="128" y="245" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">SPRSUN</text>
</svg>
